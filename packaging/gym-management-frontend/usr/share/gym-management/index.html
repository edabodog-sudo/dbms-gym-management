<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gym Management System</h1>
        <p>Manage members, courses, registrations and payments</p>
    </header>


    <main>

<!-- ========================= -->
<!-- MEMBERS -->
<!-- ========================= -->

        <section id="members-section">

            <h2>Members</h2>

            <form id="member-form">

                <input
                    type="text"
                    id="member-name"
                    placeholder="Member name"
                    required
                >

                <input
                    type="email"
                    id="member-email"
                    placeholder="Email"
                    required
                >

                <button type="submit">
                    Add Member
                </button>

            </form>

            <button id="load-members">
                Load Members
            </button>

            <div id="members-list">
            </div>

        </section>


        <!-- ========================= -->
        <!-- COURSES -->
       <!-- ========================= -->

        <section id="courses-section">

            <h2>Courses</h2>

            <form id="course-form">

                <input
                    type="text"
                    id="course-name"
                    placeholder="Course name"
                    required
                >

                <input
                    type="text"
                    id="course-trainer"
                    placeholder="Trainer"
                    required
                >

                <input
                    type="text"
                    id="course-schedule"
                    placeholder="Schedule"
                    required
                >

                <button type="submit">
                    Add Course
                </button>

            </form>

            <button id="load-courses">
                Load Courses
            </button>

            <div id="courses-list">
            </div>

        </section>


        <!-- ========================= -->
        <!-- REGISTRATIONS -->
        <!-- ========================= -->

        <section id="registrations-section">

            <h2>Registrations</h2>

            <form id="registration-form">

                <input
                    type="number"
                    id="registration-member-id"
                    placeholder="Member ID"
                    required
                >

                <input
                    type="number"
                    id="registration-course-id"
                    placeholder="Course ID"
                    required
                >

                <button type="submit">
                    Register Member
                </button>

            </form>

            <button id="load-registrations">
                Load Registrations
            </button>

            <div id="registrations-list">
            </div>

        </section>


        <!-- ========================= -->
        <!-- PAYMENTS -->
        <!-- ========================= -->

        <section id="payments-section">

            <h2>Payments</h2>

            <form id="payment-form">

                <input
                    type="number"
                    id="payment-member-id"
                    placeholder="Member ID"
                    required
                >

                <input
                    type="number"
                    id="payment-amount"
                    placeholder="Amount"
                    step="0.01"
                    required
                >

                <input
                    type="date"
                    id="payment-date"
                    required
                >

                <button type="submit">
                    Add Payment
                </button>

            </form>

            <button id="load-payments">
                Load Payments
            </button>

            <div id="payments-list">
            </div>

        </section>

    </main>


    <footer>
        <p>Gym Management System</p>
    </footer>


    <script src="app.js"></script>

</body>

</html>
